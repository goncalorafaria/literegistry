[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literegistry-base-deployment"
version = "0.1.2"
description = "Deploy LiteRegistry gateway, Redis, tools, search, and vLLM services on Beaker."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Goncalo Faria" }]
dependencies = [
  "literegistry>=1.0.47",
  "fire>=0.7,<1",
]

[project.optional-dependencies]
test = ["httpx", "pytest>=8"]
publish = ["build>=1.2", "twine>=5"]

[project.scripts]
literegistry-base-deployment = "literegistry_base_deployment.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
literegistry_base_deployment = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", ".."]
