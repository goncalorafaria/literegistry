[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literegistry-podman-client"
version = "0.1.3"
description = "A standalone asynchronous client for Podman sessions through a LiteRegistry gateway."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Goncalo Faria" },
]
keywords = ["podman", "containers", "literegistry", "asyncio", "docker-mirror"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.9,<4",
  "fire>=0.7,<1",
]

[project.scripts]
literegistry-podman-client = "literegistry_podman_client.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
]
publish = [
  "build>=1.2",
  "twine>=5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
literegistry_podman_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
